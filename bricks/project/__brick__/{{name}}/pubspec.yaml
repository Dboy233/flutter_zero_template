name: {{name}}
description: "A Flutter template project with MVI architecture, Dio, BLoC, go_router and common utilities."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# ============================================================
# 依赖冲突覆盖（高级场景，按需取消注释并填写具体版本）
# ============================================================
# dependency_overrides:
#   some_package: ^1.2.3

dependencies:
  # ---- Flutter SDK ----
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- 状态管理 ----
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1

  # ---- 网络请求 ----
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0

  # ---- 路由 ----
  go_router: ^18.0.1

  # ---- 依赖注入 ----
  get_it: ^9.2.1

  # ---- 本地存储 ----
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # ---- UI 组件与工具 ----
  easy_refresh: ^3.5.1
  flutter_easyloading: ^4.0.2
  toastification: ^3.2.0
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8

  # ---- 数据模型注解（代码生成）----
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---- 国际化 ----
  intl: ^0.20.2

  # ---- 日志 ----
  logger: ^2.7.0

  # ---- 基础工具 ----
  meta: ^1.16.0

dev_dependencies:
  # ---- 测试 ----
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  test: ^1.25.0

  # ---- 代码生成 ----
  build_runner: ^2.15.0
  freezed: ^4.0.1
  json_serializable: ^6.14.0

  # ---- 静态分析 ----
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  # ---- 以下为模板可能用到但当前未启用的配置（按需取消注释）----
  # assets:
  #   - assets/images/
  #   - assets/json/
